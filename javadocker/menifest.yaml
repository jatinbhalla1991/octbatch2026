
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: sample
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
        - name: jatin
          image: jatinbhalla1991/javasample:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: sample
spec:
  type: LoadBalancer
  selector:
    app: sample
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
