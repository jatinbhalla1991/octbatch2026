apiVersion: v1
kind: ServiceAccount
metadata:
  name: metricbeat
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metricbeat
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "events"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  # kubelet's /stats/summary endpoint (node/system/pod/container/volume
  # metricsets all read from here), reached via the apiserver's authorization
  # delegation to kubelet - this is the one extra permission the Filebeat
  # ClusterRole (40-filebeat.yaml) doesn't need.
  resources: ["nodes/stats"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metricbeat
subjects:
- kind: ServiceAccount
  name: metricbeat
  namespace: logging
roleRef:
  kind: ClusterRole
  name: metricbeat
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-daemonset-config
  namespace: logging
data:
  metricbeat.yml: |
    # Node-local metricsets: all read from the kubelet's HTTPS API on this
    # node (https://${NODE_NAME}:10250/stats/summary), so this must run as a
    # DaemonSet (one pod per node) rather than a Deployment - a pod on node A
    # can't see node B's kubelet stats.
    metricbeat.modules:
      - module: kubernetes
        metricsets:
          - node       # node CPU usage, node memory usage
          - system     # kubelet's own machine-level CPU/memory view
          - pod        # pod CPU usage, pod memory usage
          - container  # container statistics
          - volume     # volume (PVC) capacity/usage
        period: 10s
        host: ${NODE_NAME}
        hosts: ["https://${NODE_NAME}:10250"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl.verification_mode: "none"
        add_metadata: true

    output.logstash:
      hosts: ["logstash.logging.svc.cluster.local:5044"]

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metricbeat
  namespace: logging
spec:
  selector:
    matchLabels:
      app: metricbeat
  template:
    metadata:
      labels:
        app: metricbeat
    spec:
      serviceAccountName: metricbeat
      terminationGracePeriodSeconds: 30
      containers:
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.15.0
        args: ["-c", "/etc/metricbeat.yml", "--strict.perms=false"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          # Kept as small as Filebeat's footprint (same agent family): every
          # node already runs Filebeat too, and small AKS clusters are tight
          # on CPU *requests* - see the Troubleshooting section in README.md.
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/metricbeat.yml
          subPath: metricbeat.yml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: metricbeat-daemonset-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-deployment-config
  namespace: logging
data:
  metricbeat.yml: |
    # Kubernetes events are cluster-wide, not per-node, so the "event"
    # metricset runs as a single-replica Deployment - unlike the DaemonSet
    # above, running this on every node would duplicate every event N times.
    metricbeat.modules:
      - module: kubernetes
        metricsets:
          - event
        period: 10s

    output.logstash:
      hosts: ["logstash.logging.svc.cluster.local:5044"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metricbeat-event
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metricbeat-event
  template:
    metadata:
      labels:
        app: metricbeat-event
    spec:
      serviceAccountName: metricbeat
      containers:
      - name: metricbeat
        image: docker.elastic.co/beats/metricbeat:8.15.0
        args: ["-c", "/etc/metricbeat.yml", "--strict.perms=false"]
        resources:
          requests:
            memory: "100Mi"
            cpu: "100m"
          limits:
            memory: "200Mi"
            cpu: "200m"
        volumeMounts:
        - name: config
          mountPath: /etc/metricbeat.yml
          subPath: metricbeat.yml
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: metricbeat-deployment-config
