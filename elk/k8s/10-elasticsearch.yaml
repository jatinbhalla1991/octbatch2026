apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-data
  namespace: logging
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName set so AKS provisions an Azure Disk from whichever
  # StorageClass is marked as default (e.g. "managed-csi"/"default").
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: logging
spec:
  replicas: 1
  # Recreate (not the default RollingUpdate) avoids a deadlock: with a single
  # replica backed by a ReadWriteOnce PVC, RollingUpdate tries to start the new
  # pod (on possibly a different node) before the old one releases the volume
  # and its CPU reservation, which can never succeed.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      # Azure Disk volumes are mounted root-owned; fsGroup makes them writable
      # by the elasticsearch process, which runs as uid 1000 in the image.
      securityContext:
        fsGroup: 1000
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9300
          name: transport
        resources:
          # cpu request kept modest so a 2-node/2-vCPU-per-node cluster still
          # has headroom to schedule the Filebeat DaemonSet pod on this node.
          requests:
            memory: "1Gi"
            cpu: "400m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: es-data
          mountPath: /usr/share/elasticsearch/data
        readinessProbe:
          httpGet:
            path: /_cluster/health?local=true
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: es-data
        persistentVolumeClaim:
          claimName: es-data

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
